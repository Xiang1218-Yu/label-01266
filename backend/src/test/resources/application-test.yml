spring:
  application:
    name: public-rental-housing-test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  redis:
    host: localhost
    port: 6379
    database: 1
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: embedded

jwt:
  secret: test-secret-key-test-secret-key-test-secret-key-test-secret-key
  expiration: 86400000

logging:
  level:
    com.rental: DEBUG
